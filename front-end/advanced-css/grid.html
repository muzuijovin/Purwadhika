<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Grid</title>
  <link rel="stylesheet" href="grid.css">
</head>
<body>
<!-- grid
  adalah sistem layout (tata-letak) dalam css yang digunakan untuk menyusun element-element didalam sebuah container ke dalam baris (rows) dan kolom(columns) secara 2 dimensi

  grid mirip seperti tabel excel, berguna untuk menyusun element dalam bentuk kotak kotak yang terstruktur.

  property:
  > display: grid           > mengaktifkan grid
  > grid-template-columns   > mengatur jumlah dan ukuran columns
  > grid-template-rows      > mengatur jumlah dan ukuran baris
  > gap                     > memberi jarak tiap element
  > grid-columns            > mengatur lebar item
  > grid-row                > mengatur tinggi item
  -->

  <div id="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
    <div>8</div>
    <div>9</div>
  </div>

  <div id="wrapper">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
    <div>8</div>
    <div>9</div>
  </div>

</body>
</html>
